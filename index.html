<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Remote</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
    <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/180/2457A6/remote-control.png">
    
    <style>
      /* ベース設定 */
      html, body {
        background-color: #1E1E1E;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: -apple-system, sans-serif;
        touch-action: manipulation;
        -webkit-user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      
      /* グリッドレイアウト */
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        width: 85%;
        max-width: 350px;
        align-items: center;
      }

      /* 20sボタン（青い四角）の設定 */
      .btn-skip {
        background: #2457A6; border: none; color: white;
        font-size: 20px; font-weight: bold;
        border-radius: 16px;
        box-shadow: 0 4px 0 #000;
        cursor: pointer; 
        transition: transform 0.1s, box-shadow 0.1s, background 0.1s;
        -webkit-tap-highlight-color: transparent;
        height: 80px; 
        width: 100%;
      }
      .btn-skip:active {
        transform: translateY(4px);
        box-shadow: none;
        background: #555;
      }

      /* Playボタン（黄色い丸）の設定 */
      .play-circle {
        grid-column: span 2; /* 中央配置 */
        justify-self: center;
        
        width: 130px;
        height: 130px;
        border-radius: 50%; /* 丸くする */
        border: none;
        box-shadow: 0 4px 0 #000;
        cursor: pointer;
        
        margin-top: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: bold;
        
        /* 黄色背景・青文字 */
        background: #F6DA4D;
        color: #2457A6;
        
        transition: transform 0.1s, box-shadow 0.1s;
        -webkit-tap-highlight-color: transparent;
      }
      .play-circle:active {
        transform: translateY(4px);
        box-shadow: none;
        background: #C4AE3D; /* クリック時に少し暗く */
      }
      
    </style>
  </head>
  <body>
    <div class="grid">
      <button class="btn-skip" onclick="send('left_double')">⏪ 20s</button>
      <button class="btn-skip" onclick="send('right_double')">20s ⏩</button>

      <button class="play-circle" onclick="send('play')">Play / Pause</button>
    </div>

    <script>
      // ★ここにGASのURLを貼り付けてください★
      var appUrl = "https://script.google.com/macros/s/AKfycbxXZ0dPo5mFp3lILIpQPHcrZ-oMz8sXN8_Ifl62SDJHfm0X9zh730JkhVdzwTeNFhgc/exec";

      function send(cmd) {
        var target = appUrl + '?cmd=' + cmd + '&t=' + Date.now();
        fetch(target, { mode: 'no-cors' });
        if(navigator.vibrate) navigator.vibrate(50);
      }
    </script>
  </body>
</html>
